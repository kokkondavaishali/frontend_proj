version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: demand-forecast-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: demand-forecast-ml-service
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: demand-forecast-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/demand-forecast-db
      - JWT_SECRET=demand-forecast-secret-key-2026-production
      - BACKEND_PORT=5000
      - ML_SERVICE_PORT=5001
      - ML_SERVICE_URL=http://ml-service:5001
      - FRONTEND_URL=http://localhost:3000
      - NODE_ENV=production
    depends_on:
      - mongodb
      - ml-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: demand-forecast-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
